<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Client List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <img src="images/logo-black.jpg" alt="Logo" class="top-left-logo">

    <div class="main-container">
        <div class="form-header">
            <h1>Client Profiles</h1>
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>

        <div class="client-list-container">
            <!-- List Header with Search and Add Button -->
            <div class="list-actions">
                <input type="text" placeholder="Search clients..." class="search-bar">
                <a href="create-client.html" class="btn-primary small-btn">+ New Client</a>
            </div>

            <!-- Scrollable Table Container -->
            <div class="table-responsive">
                <table class="client-table">
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>Name</th>
                            <th>Company</th>
                            <th>Status</th>
                            <th>Contact</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Example Data -->
                        <!-- No clients found -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="security.js"></script>
    <script src="drag-scroll.js"></script>
    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, collection, query, orderBy, onSnapshot, deleteDoc, doc } from './firebase-config.js';

        const tableBody = document.querySelector('.client-table tbody');

        // Make deleteClient globally accessible
        window.deleteClient = async (clientId) => {
            if (confirm('Are you sure you want to delete this client? This action cannot be undone.')) {
                try {
                    await deleteDoc(doc(db, "clients", clientId));
                    // Check if page needs reload or if snapshot listener handles UI update
                    // usually snapshot listener handles it, but let's see. 
                    // Actually, snapshot listener will handle the UI update automatically.
                    alert('Client deleted successfully.');
                } catch (error) {
                    console.error("Error deleting client: ", error);
                    alert('Error deleting client: ' + error.message);
                }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else if (user.email !== 'shonkuweb@gmail.com') {
                alert('Unauthorized email. Access denied.');
                await signOut(auth);
                window.location.href = 'index.html';
            } else {
                // User is authenticated and authorized, fetch clients
                const q = query(collection(db, "clients"), orderBy("createdAt", "desc"));

                onSnapshot(q, (querySnapshot) => {
                    tableBody.innerHTML = ''; // Clear existing rows

                    if (querySnapshot.empty) {
                        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No clients found</td></tr>';
                    } else {
                        querySnapshot.forEach((docSnap) => {
                            const client = docSnap.data();
                            const row = `
                                <tr>
                                    <td>${client.clientId || 'N/A'}</td>
                                    <td>${client.name || 'N/A'}</td>
                                    <td>${client.company || 'N/A'}</td>
                                    <td><span class="status-badge ${getStatusClass(client.status)}">${client.status || 'N/A'}</span></td>
                                    <td>${client.contact || 'N/A'}</td>
                                    <td>
                                        <button class="action-btn edit-btn" onclick="alert('Edit implementation pending')">Edit</button>
                                        <button class="action-btn delete-btn" onclick="deleteClient('${docSnap.id}')">Delete</button>
                                    </td>
                                </tr>
                            `;
                            tableBody.innerHTML += row;
                        });
                    }
                }, (error) => {
                    console.error("Error fetching clients: ", error);
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Error loading clients</td></tr>';
                });
            }
        });

        function getStatusClass(status) {
            if (!status) return '';
            switch (status.toLowerCase()) {
                case 'active': return 'active';
                case 'pending': return 'pending';
                case 'completed': return 'completed';
                case 'inactive': return 'inactive';
                default: return '';
            }
        }
    </script>
</body>

</html>
