<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Top Left Logo -->
    <img src="images/logo-black.jpg" alt="Logo" class="top-left-logo">
    <div class="dashboard-container">
        <!-- Dashboard Header -->
        <h1 class="dashboard-title">Dashboard</h1>
        <p class="dashboard-subtitle">Welcome to your dashboard</p>

        <!-- Dashboard Action Buttons -->
        <div class="dashboard-actions">
            <!-- Create New Client -->
            <a href="create-client.html" class="btn-primary action-btn">+ Create Client Profile</a>
            <!-- Lead Generation Page -->
            <a href="leads.html" class="btn-primary action-btn secondary-btn">Lead Generation</a>
            <!-- View All Clients -->
            <a href="client-list.html" class="btn-primary action-btn secondary-btn">View Client Profiles</a>
        </div>
        <!-- Sign Out Button -->
        <button id="signOutBtn" class="btn-primary action-btn secondary-btn"
            style="margin-top: 24px; background-color: #fee2e2; color: #b91c1c; border-color: #fecaca; max-width: 220px; width: 100%;">Sign
            Out</button>
    </div>
    <!-- Security Script -->
    <script src="security.js"></script>
    <script type="module">
        import { auth, onAuthStateChanged, signOut } from './firebase-config.js';

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else if (user.email !== 'shonkuweb@gmail.com') {
                alert('Unauthorized email. Access denied.');
                await signOut(auth);
                window.location.href = 'index.html';
            }
        });

        document.getElementById('signOutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        });
    </script>
</body>

</html>
