<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lead Generation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <img src="images/logo-black.jpg" alt="Logo" class="top-left-logo">

    <div class="main-container">
        <!-- Toast Notification Container -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- Page Header -->
        <div class="form-header">
            <h1>Lead Generation</h1>
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>

        <!-- Lead Entry Form -->
        <form class="client-form" id="leadForm">
            <div class="form-section">
                <h2>Lead Details</h2>
                <!-- Duplicate Warning Container -->
                <div id="duplicateWarning" class="duplicate-warning hidden"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="businessName">Business Name</label>
                        <input type="text" id="businessName" required>
                    </div>
                    <div class="form-group">
                        <label for="contactNumber">Contact Number</label>
                        <input type="tel" id="contactNumber" required maxlength="10"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="leadStatus">Lead Status</label>
                        <select id="leadStatus">
                            <option value="New">New</option>
                            <option value="Contacted">Contacted</option>
                            <option value="Qualified">Qualified</option>
                            <option value="Not Interested">Not Interested</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="socialMedia">Social Media Link</label>
                        <input type="text" id="socialMedia" placeholder="Enter social media link...">
                    </div>
                </div>

                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <input type="text" id="remarks" placeholder="Add remarks..." required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Add Lead</button>
            </div>
        </form>


        <!-- Search Box -->
        <div class="search-wrapper">
            <div class="search-container">
                <div class="search-input-field">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Search by Business or Mobile...">
                    <div id="suggestionsBox" class="suggestions-box"></div>
                </div>

                <button type="button" class="btn-filter" id="filterBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filter
                </button>

                <!-- Filter Panel -->
                <div class="filter-panel" id="filterPanel">
                    <div class="filter-grid">
                        <div class="filter-group">
                            <label>Date Range</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="date" id="filterDateStart">
                                <input type="date" id="filterDateEnd">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label>Status</label>
                            <select id="filterStatus">
                                <option value="">All Statuses</option>
                                <option value="New">New</option>
                                <option value="Contacted">Contacted</option>
                                <option value="Qualified">Qualified</option>
                                <option value="Not Interested">Not Interested</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button type="button" class="btn-clear" id="clearFiltersBtn">Clear Filters</button>
                        <button type="button" class="btn-apply" id="applyFiltersBtn">Apply Filters</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leads Display Table -->
        <div class="leads-table-container">
            <h2>Generated Leads</h2>
            <div style="display: flex; justify-content: flex-end; margin-bottom: 10px; padding-right: 8px;">
                <span id="totalLeadCount" style="font-size: 14px; color: #64748b; font-weight: 600;">Total: 0</span>
            </div>
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Date</th>
                        <th>Business Name</th>
                        <th>Contact</th>
                        <th>Social Media</th>
                        <th>Remarks</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <!-- Rows will be added here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Remarks Modal -->
    <div id="remarksModal" class="modal-overlay">
        <div class="remarks-modal-box">
            <!-- <label class="remarks-label">add remarks ...</label> -->
            <textarea id="modalRemarksInput" class="remarks-textarea" placeholder="add remarks ..."></textarea>
            <div class="remarks-actions">
                <button type="button" class="btn-save-remarks" onclick="saveRemarks()">save</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal-overlay">
        <div class="confirm-modal-content">
            <h3 class="confirm-message">are you sure you want to delete it ?</h3>
            <div class="confirm-actions">
                <button type="button" class="btn-confirm-yes" onclick="confirmDelete()">yes</button>
                <button type="button" class="btn-confirm-no" onclick="closeDeleteModal()">no</button>
            </div>
        </div>
    </div>

    <script src="security.js"></script>
    <script src="drag-scroll.js"></script>
    <script type="module">
        // Import Firebase Functions
        import { db, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp, auth, onAuthStateChanged, signOut } from './firebase-config.js';

        // Auth Check
        // Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else if (user.email !== 'shonkuweb@gmail.com') {
                alert('Unauthorized email. Access denied.');
                await signOut(auth);
                window.location.href = 'index.html';
            }
        });

        // Notification System
        function showNotification(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;

            container.appendChild(toast);

            // Remove after animation (3s total: 0.3s in + 2.4s wait + 0.3s out)
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Form Submission Handler (Add or Update Lead)
        const form = document.getElementById('leadForm');
        const tableBody = document.getElementById('leadsTableBody');
        let editingRowId = null; // Track ID of row being edited

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Collect form data
            const businessName = document.getElementById('businessName').value.trim();
            const contactNumber = document.getElementById('contactNumber').value.trim();
            const leadStatus = document.getElementById('leadStatus').value;
            const socialMedia = document.getElementById('socialMedia').value.trim() || 'N/A';
            const remarks = document.getElementById('remarks').value.trim();

            // Prepare data object
            const leadData = {
                businessName,
                contactNumber,
                leadStatus,
                socialMedia,
                remarks,
                updatedAt: serverTimestamp()
            };

            try {
                if (editingRowId) {
                    // Update existing document in Firestore
                    const leadRef = doc(db, "leads", editingRowId);
                    await updateDoc(leadRef, leadData);

                    editingRowId = null;
                    document.querySelector('button[type="submit"]').textContent = 'Add Lead';
                    showNotification('Lead updated successfully!');
                } else {
                    // Add new document to Firestore
                    leadData.createdAt = serverTimestamp();
                    await addDoc(collection(db, "leads"), leadData);
                    showNotification('Lead added successfully!');
                }
                resetForm(); // Clear form
            } catch (error) {
                console.error("Error adding/updating document: ", error);
                showNotification("Error saving lead: " + error.message, 'error');
            }
        });

        // Global state for leads
        let allLeads = [];

        // Real-time Firestore Listener
        const q = query(collection(db, "leads"), orderBy("createdAt", "asc"));

        onSnapshot(q, (snapshot) => {
            allLeads = []; // Reset global list
            snapshot.forEach((docSnap) => {
                allLeads.push({ id: docSnap.id, ...docSnap.data() });
            });
            applySearchAndFilters();
        });

        // Search & Filter Logic
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');

        // Filter Elements
        const filterBtn = document.getElementById('filterBtn');
        const filterPanel = document.getElementById('filterPanel');
        const applyFiltersBtn = document.getElementById('applyFiltersBtn');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');

        let activeFilters = {
            dateStart: '',
            dateEnd: '',
            status: ''
        };

        // Toggle Filter Panel
        filterBtn.addEventListener('click', () => {
            filterPanel.classList.toggle('show');
            filterBtn.classList.toggle('active');
        });

        // Apply Filters
        applyFiltersBtn.addEventListener('click', () => {
            activeFilters = {
                dateStart: document.getElementById('filterDateStart').value,
                dateEnd: document.getElementById('filterDateEnd').value,
                status: document.getElementById('filterStatus').value
            };

            filterPanel.classList.remove('show');
            filterBtn.classList.remove('active');

            applySearchAndFilters();
        });

        // Clear Filters
        clearFiltersBtn.addEventListener('click', () => {
            document.getElementById('filterDateStart').value = '';
            document.getElementById('filterDateEnd').value = '';
            document.getElementById('filterStatus').value = '';

            activeFilters = {
                dateStart: '',
                dateEnd: '',
                status: ''
            };

            filterPanel.classList.remove('show');
            filterBtn.classList.remove('active');

            applySearchAndFilters();
        });

        searchInput.addEventListener('input', () => {
            applySearchAndFilters();
        });

        // Main Filtering Function
        function applySearchAndFilters(specificQuery = null) {
            const query = specificQuery !== null ? specificQuery : searchInput.value.toLowerCase().trim();

            let filteredResults = allLeads;

            // 1. Apply Search Query
            if (query.length > 0) {
                filteredResults = filteredResults.filter(lead => {
                    const business = (lead.businessName || '').toLowerCase();
                    const contact = (lead.contactNumber || '').toLowerCase();
                    const social = (lead.socialMedia || '').toLowerCase();
                    const remarks = (lead.remarks || '').toLowerCase();
                    return business.includes(query) || contact.includes(query) || social.includes(query) || remarks.includes(query);
                });
            }

            // 2. Apply Filters
            if (activeFilters.status) {
                filteredResults = filteredResults.filter(lead => lead.leadStatus === activeFilters.status);
            }

            if (activeFilters.dateStart) {
                const startDate = new Date(activeFilters.dateStart);
                startDate.setHours(0, 0, 0, 0); // Start of day
                filteredResults = filteredResults.filter(lead => {
                    if (!lead.createdAt) return false;
                    const leadDate = new Date(lead.createdAt.seconds * 1000);
                    return leadDate >= startDate;
                });
            }

            if (activeFilters.dateEnd) {
                const endDate = new Date(activeFilters.dateEnd);
                endDate.setHours(23, 59, 59, 999); // End of day
                filteredResults = filteredResults.filter(lead => {
                    if (!lead.createdAt) return false;
                    const leadDate = new Date(lead.createdAt.seconds * 1000);
                    return leadDate <= endDate;
                });
            }

            // Update Suggestions
            if (query.length > 0 && specificQuery === null) {
                const suggestions = filteredResults.slice(0, 5);
                if (suggestions.length > 0) {
                    suggestionsBox.innerHTML = suggestions.map(lead => `
                        <div class="suggestion-item" onclick="selectSuggestion('${lead.businessName.replace(/'/g, "\\'")}')">
                            <div>
                                <div class="suggestion-main">${lead.businessName}</div>
                                <div class="suggestion-sub">${lead.contactNumber}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    suggestionsBox.innerHTML = '<div class="suggestion-item"><div class="suggestion-sub">No matches found</div></div>';
                }
            } else {
                suggestionsBox.innerHTML = '';
            }

            renderTable(filteredResults, query);
        }

        // Close suggestions on click outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.innerHTML = '';
            }
            // Close filter panel if clicked outside
            if (!filterPanel.contains(e.target) && !filterBtn.contains(e.target)) {
                filterPanel.classList.remove('show');
                filterBtn.classList.remove('active');
            }
        });

        window.selectSuggestion = function (name) {
            searchInput.value = name;
            suggestionsBox.innerHTML = '';
            applySearchAndFilters(name.toLowerCase());
        };

        // Render Table Function
        function renderTable(leadsToRender, highlightQuery = '') {
            tableBody.innerHTML = ''; // Clear table

            // Update Total Count
            const totalCountElement = document.getElementById('totalLeadCount');
            if (totalCountElement) {
                totalCountElement.textContent = `Total: ${leadsToRender.length}`;
            }

            let counter = 0;

            leadsToRender.forEach(lead => {
                counter++;

                // Format date
                let dateStr = 'Just now';
                if (lead.createdAt) {
                    dateStr = new Date(lead.createdAt.seconds * 1000).toLocaleString();
                }

                const row = createRowElement(lead.id, counter, dateStr, lead);

                // Header Highlighting Check
                if (highlightQuery) {
                    const business = (lead.businessName || '').toLowerCase();
                    const contact = (lead.contactNumber || '').toLowerCase();
                    const social = (lead.socialMedia || '').toLowerCase();
                    const remarks = (lead.remarks || '').toLowerCase();
                    if (business.includes(highlightQuery) || contact.includes(highlightQuery) || social.includes(highlightQuery) || remarks.includes(highlightQuery)) {
                        row.classList.add('highlight-row');
                    }
                }

                tableBody.appendChild(row);
            });
        }

        // Helper to create table row HTML
        window.createRowElement = function (id, counter, date, data) {
            const row = document.createElement('tr');
            row.dataset.id = id; // Store doc ID on row for finding it later
            row.dataset.raw = JSON.stringify(data); // Store full data for easy edit populate

            // Status Dropdown Options
            const pd = ["New", "Contacted", "Qualified", "Not Interested"];
            let statusOptions = "";
            pd.forEach(s => {
                statusOptions += `<option value="${s}" ${s === data.leadStatus ? "selected" : ""}>${s}</option>`;
            });

            // Social media display
            let socialDisplay = 'N/A';
            if (data.socialMedia && data.socialMedia !== 'N/A') {
                const socialUrl = (data.socialMedia.startsWith('http://') || data.socialMedia.startsWith('https://'))
                    ? data.socialMedia
                    : `https://${data.socialMedia}`;
                socialDisplay = `<a href="${socialUrl}" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;" title="Open link">${data.socialMedia}</a> <span class="copy-target" onclick="copyToClipboard('${data.socialMedia.replace(/'/g, "\\'")}')" title="Click to copy" style="margin-left: 4px; cursor: pointer;">📋</span>`;
            }

            row.innerHTML = `
                <td>${counter}</td>
                <td>${date}</td>
                <td><strong class="copy-target" onclick="copyToClipboard('${data.businessName.replace(/'/g, "\\'")}')" title="Click to copy">${data.businessName}</strong></td>
                <td><span class="copy-target" onclick="copyToClipboard('${data.contactNumber}')" title="Click to copy">${data.contactNumber}</span></td>
                <td>${socialDisplay}</td>
                <td>
                    <button type="button" class="btn-sm btn-view-remarks" onclick="openRemarksModal('${id}')">View</button>
                </td>
                <td>
                    <select class="status-select" onchange="updateInline('${id}', 'leadStatus', this.value)">
                        ${statusOptions}
                    </select>
                </td>
                <td>
                    <div class="action-buttons">
                        <button type="button" onclick="editLead('${id}')" class="btn-action btn-edit">update</button>
                        <button type="button" onclick="deleteLead('${id}')" class="btn-action btn-delete">delete</button>
                    </div>
                </td>
            `;
            return row;
        }

        // Global variable to store ID for deletion
        let deleteId = null;
        const deleteModal = document.getElementById('deleteConfirmModal');

        // Overwrite deleteLead to show modal
        window.deleteLead = function (id) {
            deleteId = id;
            deleteModal.classList.add('show');
        }

        window.closeDeleteModal = function () {
            deleteId = null;
            deleteModal.classList.remove('show');
        }

        window.confirmDelete = async function () {
            if (!deleteId) return;

            // Optimistic Remove from DOM
            const row = document.querySelector(`tr[data-id="${deleteId}"]`);
            if (row) {
                row.remove();
            }

            try {
                await deleteDoc(doc(db, "leads", deleteId));
                showNotification('Lead deleted successfully');
            } catch (e) {
                console.error("Error deleting: ", e);
                showNotification("Failed to delete from database.", 'error');
            }
            closeDeleteModal();
        }

        // Close modal on outside click
        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                closeDeleteModal();
            }
        });

        // Copy to Clipboard Function
        window.copyToClipboard = function (text) {
            if (!text || text === 'N/A') return;

            navigator.clipboard.writeText(text).then(() => {
                showNotification('Copied to clipboard!', 'success');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showNotification('Failed to copy', 'error');
            });
        }

        window.editLead = function (id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            const data = JSON.parse(row.dataset.raw);
            editingRowId = id; // Set global ID

            // Populate form
            document.getElementById('businessName').value = data.businessName || '';
            document.getElementById('contactNumber').value = data.contactNumber || '';
            document.getElementById('leadStatus').value = data.leadStatus || 'New';
            document.getElementById('socialMedia').value = (data.socialMedia && data.socialMedia !== 'N/A') ? data.socialMedia : '';
            document.getElementById('remarks').value = data.remarks || '';

            document.querySelector('button[type="submit"]').textContent = 'Update Lead';
            document.querySelector('.form-header').scrollIntoView({ behavior: 'smooth' });
        }

        window.updateInline = async function (id, field, value) {
            try {
                const leadRef = doc(db, "leads", id);
                await updateDoc(leadRef, {
                    [field]: value,
                    updatedAt: serverTimestamp()
                });
            } catch (e) {
                console.error("Inline update failed: ", e);
                // Optionally revert UI? 
            }
        }

        // --- Duplicate Detection Logic ---

        const duplicateWarning = document.getElementById('duplicateWarning');

        // Fields to watch
        const businessInput = document.getElementById('businessName');
        const contactInput = document.getElementById('contactNumber');

        const inputsToCheck = [businessInput, contactInput].filter(Boolean);

        inputsToCheck.forEach(input => {
            input.addEventListener('input', () => {
                checkForDuplicates();
            });
        });

        function checkForDuplicates() {
            const businessVal = businessInput ? businessInput.value.trim().toLowerCase() : '';
            const contactVal = contactInput ? contactInput.value.trim().replace(/[^0-9]/g, '') : '';

            // Needs at least some input to check
            if (businessVal.length < 3 && contactVal.length < 4) {
                duplicateWarning.classList.add('hidden');
                duplicateWarning.innerHTML = '';
                return;
            }

            const matches = allLeads.filter(lead => {
                // If editing, skip self
                if (editingRowId && lead.id === editingRowId) return false;

                let matchFound = false;

                // 1. Business Name Check (Partial if > 3 chars)
                if (businessVal.length >= 3 && lead.businessName) {
                    if (lead.businessName.toLowerCase().includes(businessVal)) matchFound = true;
                }

                // 2. Contact Number Check (Last 6 digits or exact if short?)
                if (contactVal.length >= 4 && lead.contactNumber) {
                    const leadContact = lead.contactNumber.replace(/[^0-9]/g, '');
                    if (leadContact.includes(contactVal)) matchFound = true;
                }

                return matchFound;
            });

            if (matches.length > 0) {
                renderDuplicateWarning(matches);
            } else {
                duplicateWarning.classList.add('hidden');
                duplicateWarning.innerHTML = '';
            }
        }

        function renderDuplicateWarning(matches) {
            duplicateWarning.classList.remove('hidden');

            // Limit to top 3 matches to save space
            const showMatches = matches.slice(0, 3);

            let html = `
                <div class="warning-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-triangle"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span>Possible Duplicates Found (${matches.length})</span>
                </div>
                <div class="matches-list">
            `;

            showMatches.forEach(match => {
                html += `
                    <div class="match-item">
                        <div class="match-info">
                            <strong>${match.businessName}</strong>
                            <span>${match.contactNumber}</span>
                            ${match.emailAddress && match.emailAddress !== 'N/A' ? `<span>${match.emailAddress}</span>` : ''}
                        </div>
                        <button type="button" class="btn-sm btn-edit-match" onclick="editLead('${match.id}')">Edit This</button>
                    </div>
                `;
            });

            html += `</div>`;
            duplicateWarning.innerHTML = html;
        }

        window.resetForm = function () {
            form.reset();
            if (editingRowId) {
                editingRowId = null;
                document.querySelector('button[type="submit"]').textContent = 'Add Lead';
            }
        }
        // Remarks Modal Logic
        const remarksModal = document.getElementById('remarksModal');
        const modalRemarksInput = document.getElementById('modalRemarksInput');
        let currentEditingRemarksId = null;

        window.openRemarksModal = function (id) {
            console.log("Opening remarks modal for ID:", id);
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) {
                console.error("Row not found for ID:", id);
                return;
            }
            const data = JSON.parse(row.dataset.raw);

            currentEditingRemarksId = id;
            modalRemarksInput.value = data.remarks || '';
            remarksModal.classList.add('show');
            // Small delay to ensure modal is rendered or transition started before focusing
            setTimeout(() => {
                modalRemarksInput.focus();
            }, 50);
        };

        window.saveRemarks = async function () {
            if (!currentEditingRemarksId) return;

            const newRemarks = modalRemarksInput.value.trim();

            try {
                // Optimistic UI update? Or wait for snapshot?
                // Snapshot handles it, but let's update DOM dataset to prevent flicker if user reopens immediately
                const row = document.querySelector(`tr[data-id="${currentEditingRemarksId}"]`);
                if (row) {
                    const data = JSON.parse(row.dataset.raw);
                    data.remarks = newRemarks;
                    row.dataset.raw = JSON.stringify(data);
                }

                remarksModal.classList.remove('show');

                const leadRef = doc(db, "leads", currentEditingRemarksId);
                await updateDoc(leadRef, {
                    remarks: newRemarks,
                    updatedAt: serverTimestamp()
                });

                showNotification('Remarks updated');
                currentEditingRemarksId = null;
            } catch (e) {
                console.error("Error saving remarks: ", e);
                showNotification("Failed to save remarks", 'error');
            }
        };

        // Close modal on outside click
        remarksModal.addEventListener('click', (e) => {
            if (e.target === remarksModal) {
                remarksModal.classList.remove('show');
            }
        });

    </script>
</body>

</html>
