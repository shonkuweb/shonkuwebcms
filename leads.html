<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lead Generation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <img src="images/logo-black.jpg" alt="Logo" class="top-left-logo">

    <div class="main-container">
        <!-- Toast Notification Container -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- Page Header -->
        <div class="form-header">
            <h1>Lead Generation</h1>
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>

        <!-- Lead Entry Form -->
        <form class="client-form" id="leadForm">
            <div class="form-section">
                <h2>Lead Details</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="businessName">Business Name</label>
                        <input type="text" id="businessName" required>
                    </div>
                    <div class="form-group">
                        <label for="websiteType">Website Type</label>
                        <select id="websiteType" required>
                            <option value="" disabled selected>Select Website Type</option>
                            <option value="E-commerce Website">E-commerce Website</option>
                            <option value="Business Website">Business Website</option>
                            <option value="Portfolio Website">Portfolio Website</option>
                            <option value="Blog Website">Blog Website</option>
                            <option value="News Website">News Website</option>
                            <option value="Educational Website">Educational Website</option>
                            <option value="Social Networking Website">Social Networking Website</option>
                            <option value="Forum / Community Website">Forum / Community Website</option>
                            <option value="Non-Profit Website">Non-Profit Website</option>
                            <option value="Government Website">Government Website</option>
                            <option value="Entertainment Website">Entertainment Website</option>
                            <option value="Personal Website">Personal Website</option>
                            <option value="Web Application">Web Application</option>
                            <option value="Landing Page">Landing Page</option>
                            <option value="Directory / Listing Website">Directory / Listing Website</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="contactNumber">Contact Number</label>
                        <input type="tel" id="contactNumber" required maxlength="10"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)">
                    </div>
                    <div class="form-group">
                        <label for="emailAddress">Email Address</label>
                        <input type="email" id="emailAddress" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" rows="2" required></textarea>
                </div>

                <!-- Existing Website Toggle -->
                <div class="form-group">
                    <label>Existing Website?</label>
                    <div style="display: flex; gap: 20px; margin-top: 8px;">
                        <label style="display: inline-flex; align-items: center; font-weight: normal;">
                            <input type="radio" name="existingWebsite" value="yes"
                                style="width: auto; margin-right: 8px;"> Yes
                        </label>
                        <label style="display: inline-flex; align-items: center; font-weight: normal;">
                            <input type="radio" name="existingWebsite" value="no" checked
                                style="width: auto; margin-right: 8px;"> No
                        </label>
                    </div>
                </div>

                <div id="websiteFields" class="hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="websiteUrl">Website URL</label>
                            <input type="text" id="websiteUrl">
                        </div>
                        <div class="form-group">
                            <label for="websiteImprovement">Website Improvement Thoughts</label>
                            <input type="text" id="websiteImprovement">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="socialMedia">Social Media Link</label>
                        <input type="text" id="socialMedia">
                    </div>
                    <div class="form-group">
                        <label for="leadStatus">Lead Status</label>
                        <select id="leadStatus">
                            <option value="New">New</option>
                            <option value="Contacted">Contacted</option>
                            <option value="Qualified">Qualified</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="businessDescription">Business Description</label>
                    <textarea id="businessDescription" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <input type="text" id="remarks" placeholder="Add remarks..." required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Add Lead</button>
            </div>
        </form>


        <!-- Search Box -->
        <div class="search-wrapper">
            <div class="search-container">
                <div class="search-input-field">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Search by Business, Mobile, or Email...">
                    <div id="suggestionsBox" class="suggestions-box"></div>
                </div>

                <button type="button" class="btn-filter" id="filterBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filter
                </button>

                <!-- Filter Panel -->
                <div class="filter-panel" id="filterPanel">
                    <div class="filter-grid">
                        <div class="filter-group">
                            <label>Date Range</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="date" id="filterDateStart">
                                <input type="date" id="filterDateEnd">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label>Category</label>
                            <select id="filterCategory">
                                <option value="">All Categories</option>
                                <option value="E-commerce Website">E-commerce Website</option>
                                <option value="Business Website">Business Website</option>
                                <option value="Portfolio Website">Portfolio Website</option>
                                <option value="Blog Website">Blog Website</option>
                                <option value="News Website">News Website</option>
                                <option value="Educational Website">Educational Website</option>
                                <option value="Social Networking Website">Social Networking Website</option>
                                <option value="Forum / Community Website">Forum / Community Website</option>
                                <option value="Non-Profit Website">Non-Profit Website</option>
                                <option value="Government Website">Government Website</option>
                                <option value="Entertainment Website">Entertainment Website</option>
                                <option value="Personal Website">Personal Website</option>
                                <option value="Web Application">Web Application</option>
                                <option value="Landing Page">Landing Page</option>
                                <option value="Directory / Listing Website">Directory / Listing Website</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Existing Website</label>
                            <select id="filterWebsite">
                                <option value="">Any</option>
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Status</label>
                            <select id="filterStatus">
                                <option value="">All Statuses</option>
                                <option value="New">New</option>
                                <option value="Contacted">Contacted</option>
                                <option value="Qualified">Qualified</option>
                                <option value="Lost">Lost</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button type="button" class="btn-clear" id="clearFiltersBtn">Clear Filters</button>
                        <button type="button" class="btn-apply" id="applyFiltersBtn">Apply Filters</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leads Display Table -->
        <div class="leads-table-container">
            <h2>Generated Leads</h2>
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Date</th>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Website</th>
                        <th>Remarks</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <!-- Rows will be added here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="security.js"></script>
    <script src="drag-scroll.js"></script>
    <script type="module">
        // Import Firebase Functions
        import { db, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from './firebase-config.js';

        // Toggle Website Fields Visibility
        const websiteFields = document.getElementById('websiteFields');
        const radioButtons = document.querySelectorAll('input[name="existingWebsite"]');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Show fields if 'Yes', hide if 'No'
                if (e.target.value === 'yes') {
                    websiteFields.classList.remove('hidden');
                } else {
                    websiteFields.classList.add('hidden');
                }
            });
        });

        // Notification System
        function showNotification(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;

            container.appendChild(toast);

            // Remove after animation (3s total: 0.3s in + 2.4s wait + 0.3s out)
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Form Submission Handler (Add or Update Lead)
        const form = document.getElementById('leadForm');
        const tableBody = document.getElementById('leadsTableBody');
        let editingRowId = null; // Track ID of row being edited

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Collect form data
            const businessName = document.getElementById('businessName').value;
            const websiteType = document.getElementById('websiteType').value;
            const contactNumber = document.getElementById('contactNumber').value;
            const emailAddress = document.getElementById('emailAddress').value;
            const existingWebsite = document.querySelector('input[name="existingWebsite"]:checked').value;
            const remarks = document.getElementById('remarks').value;
            const businessDescription = document.getElementById('businessDescription').value;

            let websiteUrl = '';
            let websiteImprovement = '';

            // Handle conditional fields
            if (existingWebsite === 'yes') {
                websiteUrl = document.getElementById('websiteUrl').value || '';
                websiteImprovement = document.getElementById('websiteImprovement').value || '';

                // Validate fields if Yes is selected
                if (!websiteUrl) {
                    showNotification('Please enter a Website URL', 'error');
                    return;
                }
                if (!websiteImprovement) {
                    showNotification('Please enter improvement thoughts', 'error');
                    return;
                }
            }

            const leadStatus = document.getElementById('leadStatus').value;

            // Prepare data object
            const leadData = {
                businessName,
                websiteType,
                contactNumber,
                emailAddress,
                existingWebsite,
                websiteUrl,
                websiteImprovement,
                leadStatus,
                remarks,
                businessDescription,
                updatedAt: serverTimestamp()
            };

            try {
                if (editingRowId) {
                    // Update existing document in Firestore
                    const leadRef = doc(db, "leads", editingRowId);
                    await updateDoc(leadRef, leadData);

                    editingRowId = null;
                    document.querySelector('button[type="submit"]').textContent = 'Add Lead';
                    showNotification('Lead updated successfully!');
                } else {
                    // Add new document to Firestore
                    leadData.createdAt = serverTimestamp();
                    await addDoc(collection(db, "leads"), leadData);
                    showNotification('Lead added successfully!');
                }
                resetForm(); // Clear form
            } catch (error) {
                console.error("Error adding/updating document: ", error);
                showNotification("Error saving lead: " + error.message, 'error');
            }
        });

        // Global state for leads
        let allLeads = [];

        // Real-time Firestore Listener
        const q = query(collection(db, "leads"), orderBy("createdAt", "asc"));

        onSnapshot(q, (snapshot) => {
            allLeads = []; // Reset global list
            snapshot.forEach((docSnap) => {
                allLeads.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderTable(allLeads);
        });

        // Search & Filter Logic
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');

        // Filter Elements
        const filterBtn = document.getElementById('filterBtn');
        const filterPanel = document.getElementById('filterPanel');
        const applyFiltersBtn = document.getElementById('applyFiltersBtn');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');

        let activeFilters = {
            dateStart: '',
            dateEnd: '',
            category: '',
            website: '',
            status: ''
        };

        // Toggle Filter Panel
        filterBtn.addEventListener('click', () => {
            filterPanel.classList.toggle('show');
            filterBtn.classList.toggle('active');
        });

        // Apply Filters
        applyFiltersBtn.addEventListener('click', () => {
            activeFilters = {
                dateStart: document.getElementById('filterDateStart').value,
                dateEnd: document.getElementById('filterDateEnd').value,
                category: document.getElementById('filterCategory').value,
                website: document.getElementById('filterWebsite').value,
                status: document.getElementById('filterStatus').value
            };

            filterPanel.classList.remove('show');
            filterBtn.classList.remove('active');

            applySearchAndFilters();
        });

        // Clear Filters
        clearFiltersBtn.addEventListener('click', () => {
            document.getElementById('filterDateStart').value = '';
            document.getElementById('filterDateEnd').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterWebsite').value = '';
            document.getElementById('filterStatus').value = '';

            activeFilters = {
                dateStart: '',
                dateEnd: '',
                category: '',
                website: '',
                status: ''
            };

            filterPanel.classList.remove('show');
            filterBtn.classList.remove('active');

            applySearchAndFilters();
        });

        searchInput.addEventListener('input', () => {
            applySearchAndFilters();
        });

        // Main Filtering Function
        function applySearchAndFilters(specificQuery = null) {
            const query = specificQuery !== null ? specificQuery : searchInput.value.toLowerCase().trim();

            let filteredResults = allLeads;

            // 1. Apply Search Query
            if (query.length > 0) {
                filteredResults = filteredResults.filter(lead => {
                    const business = (lead.businessName || '').toLowerCase();
                    const contact = (lead.contactNumber || '').toLowerCase();
                    const email = (lead.emailAddress || '').toLowerCase();
                    return business.includes(query) || contact.includes(query) || email.includes(query);
                });
            }

            // 2. Apply Filters
            if (activeFilters.category) {
                filteredResults = filteredResults.filter(lead => lead.websiteType === activeFilters.category);
            }

            if (activeFilters.status) {
                filteredResults = filteredResults.filter(lead => lead.leadStatus === activeFilters.status);
            }

            if (activeFilters.website) {
                filteredResults = filteredResults.filter(lead => lead.existingWebsite === activeFilters.website);
            }

            if (activeFilters.dateStart) {
                const startDate = new Date(activeFilters.dateStart);
                startDate.setHours(0, 0, 0, 0); // Start of day
                filteredResults = filteredResults.filter(lead => {
                    if (!lead.createdAt) return false;
                    const leadDate = new Date(lead.createdAt.seconds * 1000);
                    return leadDate >= startDate;
                });
            }

            if (activeFilters.dateEnd) {
                const endDate = new Date(activeFilters.dateEnd);
                endDate.setHours(23, 59, 59, 999); // End of day
                filteredResults = filteredResults.filter(lead => {
                    if (!lead.createdAt) return false;
                    const leadDate = new Date(lead.createdAt.seconds * 1000);
                    return leadDate <= endDate;
                });
            }

            // Update Suggestions (only based on text search, ignoring filters for suggestions to keep it useful? 
            // Or should suggestions only show what matches filters? standard is suggestions help you search, so usually global.
            // But let's keep suggestions consistent with what the user sees.)
            if (query.length > 0 && specificQuery === null) {
                const suggestions = filteredResults.slice(0, 5);
                if (suggestions.length > 0) {
                    suggestionsBox.innerHTML = suggestions.map(lead => `
                        <div class="suggestion-item" onclick="selectSuggestion('${lead.businessName}')">
                            <div>
                                <div class="suggestion-main">${lead.businessName}</div>
                                <div class="suggestion-sub">${lead.contactNumber} • ${lead.emailAddress}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    suggestionsBox.innerHTML = '<div class="suggestion-item"><div class="suggestion-sub">No matches found</div></div>';
                }
            } else {
                suggestionsBox.innerHTML = '';
            }

            renderTable(filteredResults, query);
        }

        // Close suggestions on click outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.innerHTML = '';
            }
            // Close filter panel if clicked outside
            if (!filterPanel.contains(e.target) && !filterBtn.contains(e.target)) {
                filterPanel.classList.remove('show');
                filterBtn.classList.remove('active');
            }
        });

        window.selectSuggestion = function (name) {
            searchInput.value = name;
            suggestionsBox.innerHTML = '';
            applySearchAndFilters(name.toLowerCase());
        };

        // Render Table Function
        function renderTable(leadsToRender, highlightQuery = '') {
            tableBody.innerHTML = ''; // Clear table

            let counter = 0;
            // Group by category manually since we might be rendering a filtered subset
            // If filtered, do we still group? Yes, structure should be maintained.

            // We need to re-sort or grouping logic depends on order?
            // The leads come in date order. We can group as we iterate if we want to preserve category headers.
            // But if we filter, we might break the original "grouping" if we just iterate.
            // The original logic relied on `insertRow` finding the category header or creating it.
            // Let's reuse `insertRow` logic but we need to clear headers first.
            // `tableBody.innerHTML = ''` clears everything.

            leadsToRender.forEach(lead => {
                counter++;

                // Format date
                let dateStr = 'Just now';
                if (lead.createdAt) {
                    dateStr = new Date(lead.createdAt.seconds * 1000).toLocaleString();
                }

                // Prepare website info
                let websiteInfo = 'N/A';
                if (lead.existingWebsite === 'yes') {
                    websiteInfo = `${lead.websiteUrl} <br><small style="color: #64748b;">${lead.websiteImprovement}</small>`;
                }

                const row = createRowElement(lead.id, counter, dateStr, lead, websiteInfo);

                // Header Highlighting Check
                if (highlightQuery) {
                    const business = (lead.businessName || '').toLowerCase();
                    const contact = (lead.contactNumber || '').toLowerCase();
                    const email = (lead.emailAddress || '').toLowerCase();
                    if (business.includes(highlightQuery) || contact.includes(highlightQuery) || email.includes(highlightQuery)) {
                        row.classList.add('highlight-row');
                    }
                }

                insertRow(row, lead.websiteType);
            });
        }

        // Helper to create table row HTML (Exposed to window if needed, but here we can keep using the existing one if unchanged)
        // Note: The previous logic attached `createRowElement` to window. I should keep it or ensure my new calls use it.
        // It's defined below in the file. I will not remove it, just use it.

        /* 
           Logic to insert row into correct category group.
           Since I cleared the table, I need to recreate category headers as needed.
           The `insertRow` function I wrote earlier handles creating headers if missing!
           So I can just call it.
        */


        // Helper to create table row HTML
        window.createRowElement = function (id, counter, date, data, websiteDisplay) {
            const row = document.createElement('tr');
            row.dataset.id = id; // Store doc ID on row for finding it later
            row.dataset.raw = JSON.stringify(data); // Store full data for easy edit populate

            // Status Dropdown Options
            const pd = ["New", "Contacted", "Qualified", "Lost"];
            let statusOptions = "";
            pd.forEach(s => {
                statusOptions += `<option value="${s}" ${s === data.leadStatus ? "selected" : ""}>${s}</option>`;
            });

            // Escape single quotes in websiteRaw to prevent breaking HTML attribute
            const safeWebsiteRaw = row.dataset.raw ? row.dataset.raw.replace(/'/g, "&apos;") : "";

            row.innerHTML = `
                <td>${counter}</td>
                <td>${date}</td>
                <td><strong>${data.businessName}</strong></td>
                <td>${data.websiteType}</td>
                <td>${data.contactNumber}</td>
                <td>${data.emailAddress}</td>
                <td>${websiteDisplay}</td>
                <td><input type="text" class="remarks-input" value="${data.remarks || ''}" placeholder="Add remarks" onchange="updateInline('${id}', 'remarks', this.value)"></td>
                <td>
                    <select class="status-select" onchange="updateInline('${id}', 'leadStatus', this.value)">
                        ${statusOptions}
                    </select>
                </td>
                <td>
                    <button type="button" onclick="editLead('${id}')" class="btn-action btn-edit">Edit</button>
                    <button type="button" onclick="deleteLead('${id}')" class="btn-action btn-delete">Delete</button>
                </td>
            `;
            return row;
        }

        // Logic to insert row into correct category group
        window.insertRow = function (row, category) {
            // Find or create category section
            let categoryRow = document.getElementById(`cat-${category.replace(/\s+/g, '-')}`);

            if (!categoryRow) {
                // Create category header row if it doesn't exist
                categoryRow = document.createElement('tr');
                categoryRow.id = `cat-${category.replace(/\s+/g, '-')}`;
                categoryRow.className = 'category-header';
                categoryRow.innerHTML = `
                    <td colspan="10" style="background-color: #f1f5f9; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 0.05em; padding: 16px;">
                        ${category}
                    </td>
                `;
                tableBody.appendChild(categoryRow);
            }

            // Find the last row in this category group to append after
            let lastRowInGroup = categoryRow;
            let nextSibling = categoryRow.nextElementSibling;

            while (nextSibling && !nextSibling.classList.contains('category-header')) {
                lastRowInGroup = nextSibling;
                nextSibling = nextSibling.nextElementSibling;
            }

            if (lastRowInGroup.nextSibling) {
                tableBody.insertBefore(row, lastRowInGroup.nextSibling);
            } else {
                tableBody.appendChild(row);
            }
        }

        // Exposed functions for inline events (attached to window because module scope is private)
        window.deleteLead = async function (id) {
            // No confirmation - immediate delete
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (row) {
                row.remove(); // Remove from DOM immediately
            }

            try {
                await deleteDoc(doc(db, "leads", id));
                // No popup for delete as per request
            } catch (e) {
                console.error("Error deleting: ", e);
                // Only show error if it fails
                showNotification("Failed to delete from database.", 'error');
            }
        }

        window.editLead = function (id) {
            // Find row by dataset id is safest? Or just pass data?
            // Since we reload table on snapshot, the row might have changed if we rely on DOM object.
            // But for simple "populate form", getting data from DOM is fine.
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            const data = JSON.parse(row.dataset.raw);
            editingRowId = id; // Set global ID

            // Populate form
            document.getElementById('businessName').value = data.businessName;
            document.getElementById('websiteType').value = data.websiteType;
            document.getElementById('contactNumber').value = data.contactNumber;
            document.getElementById('emailAddress').value = data.emailAddress;
            document.getElementById('leadStatus').value = data.leadStatus;
            document.getElementById('remarks').value = data.remarks || '';
            document.getElementById('businessDescription').value = data.businessDescription || '';

            if (data.existingWebsite === 'yes') {
                document.querySelector('input[name="existingWebsite"][value="yes"]').click();
                document.getElementById('websiteUrl').value = data.websiteUrl;
                document.getElementById('websiteImprovement').value = data.websiteImprovement;
            } else {
                document.querySelector('input[name="existingWebsite"][value="no"]').click();
            }

            document.querySelector('button[type="submit"]').textContent = 'Update Lead';
            document.querySelector('.form-header').scrollIntoView({ behavior: 'smooth' });
        }

        window.updateInline = async function (id, field, value) {
            try {
                const leadRef = doc(db, "leads", id);
                await updateDoc(leadRef, {
                    [field]: value,
                    updatedAt: serverTimestamp()
                });
            } catch (e) {
                console.error("Inline update failed: ", e);
                // Optionally revert UI? 
            }
        }

        window.resetForm = function () {
            form.reset();
            websiteFields.classList.add('hidden');
            document.querySelector('input[name="existingWebsite"][value="no"]').checked = true;
            if (editingRowId) {
                editingRowId = null;
                document.querySelector('button[type="submit"]').textContent = 'Add Lead';
            }
        }
    </script>
</body>

</html>
