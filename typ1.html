<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configure E-commerce Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* specific overrides for this form */
        .main-container {
            max-width: 900px;
        }

        .section-header {
            margin-top: 2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .subsection-header {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
        }

        .checkbox-group,
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .checkbox-item,
        .radio-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-item input[type="checkbox"],
        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }

        .checkbox-item label,
        .radio-item label {
            font-size: 14px;
            color: #334155;
            cursor: pointer;
            margin-bottom: 0;
            /* Override global label margin */
            font-weight: 400;
        }

        .hidden-section {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .file-upload-wrapper {
            position: relative;
            margin-top: 8px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 50px;
            height: 40px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: none;
        }

        .form-row.three-col {
            grid-template-columns: 1fr 1fr 1fr;
        }

        @media (max-width: 768px) {
            .form-row.three-col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <img src="images/logo-black.jpg" alt="Logo" class="top-left-logo">

    <div class="main-container">
        <div class="form-header">
            <div>
                <h1>E-commerce Website Setup</h1>
                <p style="color: #64748b; margin-top: 5px;">Complete the details below to configure your project</p>
            </div>
            <a href="create-client.html" class="back-link">← Back</a>
        </div>

        <form class="client-form" id="ecommerceForm">

            <!-- Section 1: Business Identity -->
            <h2 class="section-header">1. Business Identity</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="businessName">Legal Business Name <span style="color:red">*</span></label>
                    <input type="text" id="businessName" placeholder="e.g. Acme Retail Pvt Ltd" required>
                </div>
                <div class="form-group">
                    <label for="businessType">Business Type <span style="color:red">*</span></label>
                    <select id="businessType" required>
                        <option value="" disabled selected>Select Type</option>
                        <option value="Sole Proprietorship">Sole Proprietorship</option>
                        <option value="Partnership Firm">Partnership Firm</option>
                        <option value="LLP">Limited Liability Partnership (LLP)</option>
                        <option value="Private Limited">Private Limited Company</option>
                        <option value="OPC">One Person Company (OPC)</option>
                        <option value="Public Limited">Public Limited Company</option>
                        <option value="Section 8">Section 8 Company (Non-Profit)</option>
                        <option value="HUF">Hindu Undivided Family (HUF)</option>
                        <option value="Co-operative">Co-operative Society</option>
                        <option value="Producer">Producer Company</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="businessAddress">Registered Business Address <span style="color:red">*</span></label>
                <textarea id="businessAddress" placeholder="Full registered address including PIN code" rows="3"
                    required></textarea>
            </div>


            <!-- Section 2: Primary Contact Details -->
            <h2 class="section-header">2. Primary Contact Details</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Contact Person Name</label>
                    <input type="text" placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Role in Business</label>
                    <input type="text" placeholder="e.g. Owner, Manager">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="+91 XXXXX XXXXX">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com">
                </div>
            </div>




            <!-- Section 3: Details Needed -->
            <h2 class="section-header">3. Details Needed</h2>
            <div class="form-group">
                <div class="checkbox-group">
                    <!-- 1. GST Question -->
                    <div class="checkbox-item" style="display: block;">
                        <label style="margin-bottom: 5px; display: block; font-weight: 600;">1. Do they have
                            GST?</label>
                        <div class="radio-group" style="flex-direction: row; gap: 20px;">
                            <div class="radio-item">
                                <input type="radio" name="hasGST" id="gstYes" value="yes"
                                    onchange="toggleGSTCheck(true)">
                                <label for="gstYes">Yes</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" name="hasGST" id="gstNo" value="no" checked
                                    onchange="toggleGSTCheck(false)">
                                <label for="gstNo">No</label>
                            </div>
                        </div>
                    </div>

                    <div id="gstDetailsInput" class="hidden-section" style="margin-bottom: 15px;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>GSTIN Number</label>
                                <input type="text" placeholder="22AAAAA0000A1Z5" style="text-transform: uppercase;">
                            </div>
                            <div class="form-group">
                                <label>Business / Proprietor PAN</label>
                                <input type="text" placeholder="ABCDE1234F" style="text-transform: uppercase;">
                            </div>
                        </div>
                    </div>

                    <!-- 2. Logo -->
                    <div class="checkbox-item" style="display: block;">
                        <label style="margin-bottom: 5px; display: block; font-weight: 600;">2. Do they have
                            logo?</label>
                        <div class="radio-group" style="flex-direction: row; gap: 20px;">
                            <div class="radio-item">
                                <input type="radio" name="hasLogo" id="logoYes" value="yes"
                                    onchange="toggleLogoMessage(true)">
                                <label for="logoYes">Yes</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" name="hasLogo" id="logoNo" value="no" checked
                                    onchange="toggleLogoMessage(false)">
                                <label for="logoNo">No</label>
                            </div>
                        </div>
                        <div id="logoMessage" class="hidden-section"
                            style="margin-top: 10px; padding: 10px; border: 1px solid #3b82f6; background-color: #eff6ff; color: #1e40af; border-radius: 4px; font-size: 0.9em;">
                            Please send the logo in HD quality in WhatsApp.
                        </div>
                    </div>

                    <!-- 3. Product Data -->
                    <div class="checkbox-item" style="display: block;">
                        <label style="font-weight: 600;">3. Product Data</label>
                        <div id="productDataMessage"
                            style="margin-top: 10px; margin-left: 30px; padding: 10px; border: 1px solid #3b82f6; background-color: #eff6ff; color: #1e40af; border-radius: 4px; font-size: 0.9em;">
                            Please send the images, description, and pricing of all products in WhatsApp.
                        </div>
                    </div>

                    <!-- 4. User Facing Pages -->
                    <div class="checkbox-item">
                        <label style="font-weight: 600;">4. User facing website pages required</label>
                    </div>

                    <div id="userPagesList"
                        style="margin-left: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px;">
                        <div class="checkbox-item"><input type="checkbox" id="kp_home"><label for="kp_home">Home</label>
                        </div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_category"><label
                                for="kp_category">Category</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_pdp"><label for="kp_pdp">Product
                                Details Page</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_search"><label for="kp_search">Search
                                Results Page</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_cart"><label for="kp_cart">Cart
                                Page</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_checkout"><label
                                for="kp_checkout">Checkout</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_login"><label for="kp_login">Login /
                                Signup Page</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_dashboard"><label
                                for="kp_dashboard">User Dashboard</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_history"><label for="kp_history">Order
                                History Page</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_wishlist"><label
                                for="kp_wishlist">Wishlist Page</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_track"><label for="kp_track">Track
                                Order</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="kp_confirm"><label for="kp_confirm">Order
                                Confirmation/Thankyou Page</label></div>
                    </div>

                    <!-- 5. Admin Panel Pages -->
                    <div class="checkbox-item">
                        <label style="font-weight: 600;">5. Admin panel web pages required</label>
                    </div>
                    <div id="adminPagesList"
                        style="margin-left: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                        <div class="checkbox-item"><input type="checkbox" id="ap_login"><label for="ap_login">Admin
                                Login</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_dash"><label
                                for="ap_dash">Dashboard/Analytics</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_prod"><label for="ap_prod">Product
                                Management</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_cat"><label for="ap_cat">Category
                                Management</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_ord"><label for="ap_ord">Order
                                Management</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_cust"><label for="ap_cust">Customer
                                Management</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_inv"><label for="ap_inv">Inventory /
                                Stock</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_pay"><label for="ap_pay">Payment
                                Settings</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_ship"><label for="ap_ship">Shipping
                                Settings</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_offer"><label for="ap_offer">Offers or
                                Coupons</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ap_cms"><label for="ap_cms">CMS/Banner
                                Manager</label></div>
                    </div>

                    <!-- 6. Payment Gateway -->
                    <div class="checkbox-item" style="display: block;">
                        <label style="margin-bottom: 5px; display: block; font-weight: 600;">6. Do you want to collect
                            payment through website?</label>
                        <div class="radio-group" style="flex-direction: row; gap: 20px;">
                            <div class="radio-item">
                                <input type="radio" name="wantPG" id="pgYes" value="yes" onchange="updatePGDocuments()">
                                <label for="pgYes">Yes</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" name="wantPG" id="pgNo" value="no" checked
                                    onchange="updatePGDocuments()">
                                <label for="pgNo">No</label>
                            </div>
                        </div>
                    </div>

                    <div id="pgDocumentsList" class="hidden-section"
                        style="margin-left: 20px; margin-bottom: 15px; border-left: 2px solid #3b82f6; padding-left: 15px;">
                        <!-- Dynamic Content will be inserted here -->
                    </div>

                    <!-- 7. COD -->
                    <div class="checkbox-item" style="display: block;">
                        <label style="margin-bottom: 5px; display: block; font-weight: 600;">7. Will they allow
                            COD?</label>
                        <div class="radio-group" style="flex-direction: row; gap: 20px;">
                            <div class="radio-item">
                                <input type="radio" name="allowCOD" id="codYes" value="yes" onchange="toggleCOD(true)">
                                <label for="codYes">Yes</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" name="allowCOD" id="codNo" value="no" checked
                                    onchange="toggleCOD(false)">
                                <label for="codNo">No</label>
                            </div>
                        </div>
                    </div>

                    <div id="codDetails" class="hidden-section"
                        style="margin-left: 20px; border-left: 2px solid #3b82f6; padding-left: 15px; margin-bottom: 15px;">
                        <!-- 7a. Delivery Fleet -->
                        <div class="checkbox-item" style="display: block;">
                            <label style="margin-bottom: 5px; display: block; font-weight: 600;">Do they have own
                                delivery fleet and pricing?</label>
                            <div class="radio-group" style="flex-direction: row; gap: 20px;">
                                <div class="radio-item">
                                    <input type="radio" name="hasFleet" id="fleetYes" value="yes"
                                        onchange="toggleFleet(true)">
                                    <label for="fleetYes">Yes</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" name="hasFleet" id="fleetNo" value="no" checked
                                        onchange="toggleFleet(false)">
                                    <label for="fleetNo">No</label>
                                </div>
                            </div>
                        </div>

                        <!-- 7b. Area and Cost -->
                        <div id="fleetDetails" class="hidden-section" style="margin-top: 10px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Area allowed for COD
                                and cost</label>
                            <textarea class="form-control" rows="3"
                                placeholder="Enter areas and pricing details..."></textarea>
                        </div>
                    </div>

                    <!-- 8. Delivery Options -->
                    <div class="checkbox-item" style="display: block;">
                        <label style="margin-bottom: 5px; display: block; font-weight: 600;">8. Delivery Options</label>
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-left: 20px;">
                            <div class="checkbox-item">
                                <input type="checkbox" id="deliveryInhouse"
                                    onchange="toggleInhouseDetails(this.checked)">
                                <label for="deliveryInhouse">Inhouse</label>
                            </div>
                            <div id="inhouseDetails" class="hidden-section"
                                style="margin-left: 30px; margin-bottom: 5px;">
                                <label style="display: block; margin-bottom: 5px; font-size: 0.9em;">Information related
                                    to this method</label>
                                <textarea class="form-control" rows="2"
                                    placeholder="Enter inhouse delivery details..."></textarea>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="deliveryThirdParty">
                                <label for="deliveryThirdParty">Third party delivery integration</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary"
                    onclick="window.location.href='create-client.html'">Cancel</button>
                <button type="button" class="btn-primary"
                    onclick="alert('Form submitted successfully!'); window.location.href='client-list.html'">Create
                    Project</button>
            </div>
        </form>
    </div>

    <script src="security.js"></script>
    <script>
        // Conditional Logic Functions
        function toggleGSTCheck(show) {
            const el = document.getElementById('gstDetailsInput');
            el.style.display = show ? 'block' : 'none';
        }

        function toggleLogoMessage(show) {
            const el = document.getElementById('logoMessage');
            el.style.display = show ? 'block' : 'none';
        }

        function toggleCOD(show) {
            const el = document.getElementById('codDetails');
            el.style.display = show ? 'block' : 'none';
        }

        function toggleFleet(show) {
            const el = document.getElementById('fleetDetails');
            el.style.display = show ? 'block' : 'none';
        }

        function toggleInhouseDetails(show) {
            const el = document.getElementById('inhouseDetails');
            el.style.display = show ? 'block' : 'none';
        }



        const pgRequirements = {
            "Sole Proprietorship": [
                "Proprietor’s Proof: Personal PAN card",
                "Address Proof: Aadhaar/Voter ID/Passport",
                "Business Registration Proof: GST/Utility Bill/Rent Agreement/MSME/Shop Act",
                "Bank Proof: Cancelled cheque or passbook with business name",
                "Other: Trade licence (if applicable)"
            ],
            "Partnership Firm": [
                "Firm’s Proof: PAN card of the partnership firm",
                "Constitution Documents: Registered Partnership deed",
                "Address Proof of Firm: Commercial property documents or NOC",
                "Partners’ Proof: PAN and Aadhaar of all authorised signatories",
                "Bank Proof: Cancelled cheque with firm’s name",
                "Other: Shop & Establishment cert, GST cert",
                "UBO Declarations for partners > 10% share"
            ],
            "LLP": [
                "Registration Proof: Certificate of Incorporation (CoI) and LLP Agreement",
                "Address Proof of Firm: PAN Card of the LLP",
                "Designated Partners’ Proof: PAN and Address proofs",
                "Bank Proof: Cancelled cheque or bank statement in LLP’s name"
            ],
            "Private Limited": [
                "Registration Proof: Certificate of Incorporation (CoI)",
                "Constitution Documents: MoA and AoA",
                "Company Proof: Company PAN Card",
                "Board Resolution on company letterhead",
                "Directors’ Proof: PAN and Address proofs",
                "Other: Bank proof, GST certificate, Website with policies"
            ],
            "Public Limited": [
                "Registration Proof: Certificate of Incorporation (CoI)",
                "Constitution Documents: MoA and AoA",
                "Company Proof: Company PAN Card",
                "Board Resolution on company letterhead",
                "Directors’ Proof: PAN and Address proofs",
                "Other: Bank proof, GST certificate, Website with policies"
            ],
            "Section 8": [
                "Registration Proof: Trust Deed or Registration Certificate",
                "Entity Proof: PAN Card of the Trust/NGO",
                "Authorisation: Resolution letter",
                "Bank Proof: Cancelled cheque or bank statement"
            ]
        };

        // Map other types to closest match
        pgRequirements["OPC"] = pgRequirements["Private Limited"];
        pgRequirements["HUF"] = pgRequirements["Sole Proprietorship"]; // Fallback/Approximation
        pgRequirements["Co-operative"] = pgRequirements["Section 8"]; // Approximation
        pgRequirements["Producer"] = pgRequirements["Private Limited"];

        function updatePGDocuments() {
            const wantPG = document.querySelector('input[name="wantPG"]:checked').value === 'yes';
            const container = document.getElementById('pgDocumentsList');
            const businessType = document.getElementById('businessType').value;

            if (wantPG) {
                if (!businessType) {
                    container.innerHTML = '<p style="color: #eab308;">Please select a Business Type in Section 1 to see required documents.</p>';
                    container.style.display = 'block';
                    return;
                }

                const docs = pgRequirements[businessType] || [];
                if (docs.length === 0) {
                    container.innerHTML = '<p>No specific documents listed for this business type.</p>';
                } else {
                    let html = '<p style="font-weight:600; margin-bottom:10px;">Required Documents for ' + businessType + ':</p>';
                    docs.forEach((doc, index) => {
                        html += `
                            <div class="checkbox-item">
                                <input type="checkbox" id="pg_doc_${index}" checked>
                                <label for="pg_doc_${index}">${doc}</label>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        // Add listener to business type to update list if already 'Yes'
        document.getElementById('businessType').addEventListener('change', updatePGDocuments);

    </script>
</body>

</html>
