<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Client</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .hidden-section {
            display: none;
        }

        /* Custom styles for checkbox groups to look neat */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"],
        .checkbox-item input[type="radio"] {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
            accent-color: #0f172a;
        }

        /* Sub-sections within form cards */
        .sub-section-title {
            font-size: 15px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 16px;
            margin-top: 24px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-left: 3px solid #0f172a;
            padding-left: 10px;
        }

        .conditional-field {
            display: none;
            margin-top: 12px;
            padding: 16px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="main-container">

        <!-- INITIAL STEP: SELECT TYPE -->
        <div id="initial-step">
            <div class="form-header">
                <h1>Create New Client</h1>
                <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
            </div>

            <form class="client-form" id="typeSelectionForm">
                <div class="form-section">
                    <h2>Client Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="clientName">Client Name</label>
                            <input type="text" id="clientName" name="clientName" placeholder="Enter full name" required>
                        </div>
                        <div class="form-group">
                            <label for="companyName">Company Name</label>
                            <input type="text" id="companyName" name="companyName" placeholder="Enter company name"
                                required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="clientStatus">Status</label>
                            <select id="clientStatus" name="clientStatus" required>
                                <option value="Active">Active</option>
                                <option value="Pending">Pending</option>
                                <option value="Completed">Completed</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="clientContact">Contact Info</label>
                            <input type="text" id="clientContact" name="clientContact" placeholder="Email or Phone"
                                required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Project Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="websiteType">Website Type</label>
                            <select id="websiteType" name="websiteType" required>
                                <option value="" disabled selected>Select Website Type</option>
                                <option value="E-commerce Website">E-commerce Website</option>
                                <option value="Business Website">Business Website</option>
                                <option value="Portfolio Website">Portfolio Website</option>
                                <option value="Blog Website">Blog Website</option>
                                <option value="News Website">News Website</option>
                                <option value="Educational Website">Educational Website</option>
                                <option value="Social Networking Website">Social Networking Website</option>
                                <option value="Forum / Community Website">Forum / Community Website</option>
                                <option value="Non-Profit Website">Non-Profit Website</option>
                                <option value="Government Website">Government Website</option>
                                <option value="Entertainment Website">Entertainment Website</option>
                                <option value="Personal Website">Personal Website</option>
                                <option value="Web Application">Web Application</option>
                                <option value="Landing Page">Landing Page</option>
                                <option value="Directory / Listing Website">Directory / Listing Website</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary"
                        onclick="window.location.href='client-list.html'">Cancel</button>
                    <button type="submit" class="btn-primary">Create Client</button>
                </div>
            </form>
        </div>

        <!-- E-COMMERCE STEP: DETAILED FORM (Hidden/Bypassed for now) -->
        <div id="ecommerce-form-step" class="hidden-section">
            <!-- Content preserved but hidden -->
        </div>
    </div>

    <script type="module">
        import { db, collection, addDoc, serverTimestamp, auth, onAuthStateChanged, signOut } from './firebase-config.js';

        // Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else if (user.email !== 'shonkuweb@gmail.com') {
                alert('Unauthorized email. Access denied.');
                await signOut(auth);
                window.location.href = 'index.html';
            }
        });

        const typeSelectionForm = document.getElementById('typeSelectionForm');

        typeSelectionForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const clientName = document.getElementById('clientName').value;
            const companyName = document.getElementById('companyName').value;
            const clientStatus = document.getElementById('clientStatus').value;
            const clientContact = document.getElementById('clientContact').value;
            const websiteType = document.getElementById('websiteType').value;

            // Generate a simple Client ID
            const clientId = 'CL-' + Math.floor(1000 + Math.random() * 9000);

            try {
                await addDoc(collection(db, "clients"), {
                    clientId: clientId,
                    name: clientName,
                    company: companyName,
                    status: clientStatus,
                    contact: clientContact,
                    websiteType: websiteType,
                    createdAt: serverTimestamp()
                });

                alert('Client created successfully!');
                window.location.href = 'client-list.html';
            } catch (error) {
                console.error("Error adding document: ", error);
                alert('Error creating client. See console for details.');
            }
        });
    </script>
</body>

</html>
