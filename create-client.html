<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Client</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Scoped styles for this specific simplified page */
        .create-client-container {
            width: 100%;
            max-width: 520px;
            margin: 30px auto;
            padding: clamp(1.25rem, 4vw, 2.5rem);
            background: white;
            border-radius: var(--radius-xl, 24px);
            border: 1px solid var(--border-subtle, #e2e8f0);
            box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.07));
            text-align: center;
        }

        .dropdown-group {
            margin-bottom: 2rem;
            text-align: left;
        }

        .dropdown-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary, #64748b);
        }

        .styled-select {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: 1px solid var(--input-border, #cbd5e1);
            border-radius: var(--radius-md, 12px);
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            background-color: white;
            color: var(--text-primary, #0f172a);
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm, 0 1px 2px 0 rgba(0,0,0,0.05));
        }

        .styled-select:focus {
            border-color: var(--accent-dark, #0f172a);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .next-btn {
            width: 100%;
        }
    </style>
</head>

<body>
    <img src="images/logo-black.jpg" alt="Logo" class="top-left-logo">

    <div class="main-container">
        <div class="form-header">
            <h1>Create New Client</h1>
            <a href="client-list.html" class="back-link">← Back to Client List</a>
        </div>

        <div class="create-client-container">
            <div class="dropdown-group">
                <label for="websiteType">Select Website Type</label>
                <select id="websiteType" class="styled-select">
                    <option value="" disabled selected>Choose a type...</option>
                    <option value="typ1.html">E-commerce Website</option>
                    <option value="typ2.html">Business Website</option>
                    <option value="typ3.html">Portfolio Website</option>
                    <option value="typ4.html">Blog Website</option>
                    <option value="typ5.html">News Website</option>
                    <option value="typ6.html">Educational Website</option>
                    <option value="typ7.html">Social Networking Website</option>
                    <option value="typ8.html">Forum / Community Website</option>
                    <option value="typ9.html">Non-Profit Website</option>
                    <option value="typ10.html">Government Website</option>
                    <option value="typ11.html">Entertainment Website</option>
                    <option value="typ12.html">Personal Website</option>
                    <option value="typ13.html">Web Application</option>
                    <option value="typ14.html">Landing Page</option>
                    <option value="typ15.html">Directory / Listing Website</option>
                </select>
            </div>

            <button id="nextBtn" class="btn-primary next-btn">Next</button>
        </div>
    </div>

    <script src="security.js"></script>
    <script>
        const nextBtn = document.getElementById('nextBtn');
        const websiteTypeSelect = document.getElementById('websiteType');

        nextBtn.addEventListener('click', () => {
            const selectedValue = websiteTypeSelect.value;
            if (selectedValue) {
                window.location.href = selectedValue;
            } else {
                alert('Please select a website type first.');
            }
        });
    </script>
</body>

</html>
